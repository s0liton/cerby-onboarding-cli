# Cerby Onboarding CLI — service configuration
# Copy to config/config.yaml and edit. Used by: cerby-onboarding service --config config/config.yaml
#
# Bootstrap (pick one):
#   • Set access_token below — consumed on first service start, then removed from this file.
#   • Or sign in interactively once so assets/.cerby_session.json exists.
#
# Create the work session name interactively first (manual or automated run), then reference it here.

workspace: mycompany

# One app, comma-separated string, or a YAML list — same as interactive mode.
app_names:
  - slack
  - zoom
# app_name: slack,zoom   # alternative

account_role: COLLABORATOR

# One-time bootstrap bearer token (optional). Removed from this file after first successful load.
# access_token: ""

# Must match an existing work session (unique name; created via interactive run).
session_name: production-onboarding

actions: both          # rotate | role | both
poll_interval: 30s
role_exclude_user_ids: []

log_file: log/cerby-onboarding.log
running_report: running_report.json

experimental_keep_browser_for_token: true
verbose_http: false
